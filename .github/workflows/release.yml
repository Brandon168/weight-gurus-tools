name: release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            name: linux-x86_64
            ext: tar.gz
            bin_suffix: ""
          - os: macos-latest
            name: macos-aarch64
            ext: tar.gz
            bin_suffix: ""
          - os: windows-latest
            name: windows-x86_64
            ext: zip
            bin_suffix: ".exe"
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Build release binary
        run: cargo build --release --locked
      - name: Package artifact (unix)
        if: matrix.ext != 'zip'
        run: |
          mkdir -p dist
          tar -czf dist/weight-gurus-cli-${{ matrix.name }}.${{ matrix.ext }} -C target/release weight-gurus-cli
      - name: Package artifact (windows)
        if: matrix.ext == 'zip'
        shell: pwsh
        run: |
          Compress-Archive -Path target/release/weight-gurus-cli${{ matrix.bin_suffix }} -DestinationPath dist/weight-gurus-cli-${{ matrix.name }}.${{ matrix.ext }} -Force
      - uses: actions/upload-artifact@v4
        with:
          name: weight-gurus-cli-${{ matrix.name }}
          path: dist/weight-gurus-cli-${{ matrix.name }}.${{ matrix.ext }}

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
      - name: Publish release assets
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            dist/**/weight-gurus-cli-*.*
