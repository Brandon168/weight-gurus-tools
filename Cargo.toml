[package]
name = "weight-gurus-cli"
version = "0.3.0"
edition = "2021"
description = "Weight Gurus CLI for authenticated measurement exports and JSON summaries"
license = "MIT"
publish = false

[dependencies]
anyhow = "1.0.95"
clap = { version = "4.5.20", features = ["derive", "env"] }
chrono = { version = "0.4.38", features = ["clock"] }
regex = "1.11.1"
reqwest = { version = "0.12.12", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1.0.215", features = ["derive"] }
serde_json = "1.0.133"
tokio = { version = "1.43.0", features = ["macros", "rt-multi-thread"] }

[dev-dependencies]
assert_cmd = "2.0.16"
wiremock = "0.6.2"
predicates = "3.1.3"
tempfile = "3.17.1"
